<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull King Score Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">
        <img src="white-skull.png" alt="Skull King Logo" class="logo-img">
      </div>
      <div class="title-group">
        <h1>SKULL KING</h1>
        <div class="subtitle">SCORE TRACKER</div>
      </div>
    </div>
    <div class="round-nav">
      <span>ROUND</span>
      <button class="nav-btn" id="prev-round">‹</button>
      <span class="highlight"><span id="nav-current-round">1</span> / 10</span>
      <button class="nav-btn" id="next-round">›</button>
      <div class="round-dots" id="round-dots">
        <!-- Dots injected via JS -->
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2><span class="gold-dash">—</span> CREW MANIFEST</h2>
      <div class="manifest-controls">
        <div class="crew-list" id="crew-list">
          <!-- Crew injected via JS -->
        </div>
        <div class="add-crew-input">
          <input type="text" id="new-player-name" placeholder="Add crew member...">
          <button class="btn-gold" id="add-player-btn">+ ADD</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="scoring-header">
        <h2><span class="gold-dash">—</span> ROUND <span id="scoring-round-text">1</span> — BID ENTRY</h2>
        <div class="round-globals">
          <span class="tricks-available" id="tricks-available">1 trick available</span>
          <div class="global-kraken">
            <label for="global-kraken-checkbox">KRAKEN PLAYED:</label>
            <input type="checkbox" id="global-kraken-checkbox" class="kraken-checkbox">
          </div>
        </div>
      </div>

      <div class="scoring-table">
        <div class="table-header">
          <div>PLAYER</div>
          <div>BID</div>
          <div>TRICKS WON</div>
          <div>BONUS PTS</div>
          <div>SCORE</div>
        </div>
        
        <div id="scoring-rows" class="table-body">
          <!-- Scoring rows injected via JS -->
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
