<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Form</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-container">
        <form id="ticket-form" novalidate>
            <h2>Event Ticket</h2>
            
            <div class="row-two-columns">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="lastName" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="row-two-columns">
                <div class="form-group">
                    <label for="user-type">Type</label>
                    <select id="user-type" name="userType" required>
                        <option value="" disabled selected>Choose one</option>
                        <option value="student">Student</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" name="eventDate" required>
                </div>
            </div>

            <div id="dynamic-field" class="form-group hidden">
                <label id="dynamic-label" for="dynamic-input">Placeholder Label</label>
                <input type="text" id="dynamic-input" name="dynamicInput">
            </div>

            <button type="submit" id="submit-btn">Create Ticket</button>
        </form>

        <div id="error-container" class="error-box hidden"></div>
        
        <div id="success-container" class="success-box hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
