<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="recipes.js" defer></script>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book - Apple Crisp">
    <meta property="og:description" content="A simple yet delicious fall dessert that's great served warm with vanilla ice cream.">
    <meta property="og:url" content="https://githubusername.github.io/wdd131/recipes">
    <meta property="og:image" content="images/apple-crisp.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book - Apple Crisp">
    <meta name="twitter:description" content="A simple yet delicious fall dessert that's great served warm with vanilla ice cream.">
    <meta name="twitter:image" content="images/apple-crisp.jpg">

    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/recipe-book.png" alt="Recipe Book Logo" class="logo">
            <h1>RecipeBook</h1>
        </div>
    </header>

    <section class="search-section">
        <form class="search-box">
            <input type="text" placeholder="Find a recipe" aria-label="Search recipes">
            <button type="submit">
                <img src="images/search.svg" alt="Search">
            </button>
        </form>
    </section>

    <main id="recipe-container">

    </main>

    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        
        <div class="social">
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
    </footer>

</body>
</html>
